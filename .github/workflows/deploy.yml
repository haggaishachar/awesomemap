name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Data now lives in awesomemap-data's D1 database, not in commits to
    # this repo, so nothing here triggers `on: push` when new data lands.
    # This daily cron is the only thing that picks up fresh domains,
    # projects, and star-history from awesomemap-data's API — not a
    # safeguard against a missed push, but the actual refresh mechanism.
    - cron: "0 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from the custom domain root (see CNAME below), not a
      # `/awesomemap` project-page subpath, so BASE_PATH stays empty.
      BASE_PATH: ""
      SITE_URL: https://awesomemap.dev
      # Written into dist/CNAME so GitHub Pages keeps the custom domain
      # configured across Actions-based deploys (it isn't persisted any
      # other way for workflow-based publishing).
      CNAME: awesomemap.dev
      # Explicit even though it currently matches data-store.mjs's
      # hardcoded default — keeps production deploys independently
      # controllable (e.g. pointing at a staging awesomemap-data
      # deployment) without a code change.
      AWESOMEMAP_DATA_API_URL: ${{ secrets.AWESOMEMAP_DATA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: node scripts/generate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
