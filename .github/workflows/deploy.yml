name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Runs an hour after snapshot-history.yml's "0 6 * * *" cron so this
    # picks up that day's snapshot commit. A push from snapshot-history.yml
    # uses the default GITHUB_TOKEN, and GitHub deliberately does not
    # trigger other workflows (like this one's `on: push`) from
    # GITHUB_TOKEN-authored pushes, so a daily schedule here is needed to
    # guarantee the site's Rising sizes actually get rebuilt.
    - cron: "0 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /awesomemap
      # NOTE: origin only — generate.mjs builds absolute URLs as
      # `${SITE_URL}${BASE_PATH}/...`, so SITE_URL must NOT itself include
      # `/awesomemap` or the path segment gets duplicated
      # (https://haggaishachar.github.io/awesomemap/awesomemap/...).
      SITE_URL: https://haggaishachar.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: node scripts/generate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
