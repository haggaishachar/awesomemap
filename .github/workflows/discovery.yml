name: Discovery

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/discover-projects.mjs
      # if: always() — must still commit whatever was already written to
      # disk (domain files + seen.json) even if the previous step exited
      # non-zero partway through (e.g. a mid-run network failure), so a
      # partial run's real progress isn't silently lost.
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/domains/*.json data/projects/ data/discovery/
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
          else
            git commit -m "chore: daily project discovery"
            git push
          fi
