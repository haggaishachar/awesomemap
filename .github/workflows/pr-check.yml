name: PR Check

# Runs on every pull request so a contribution gets automated feedback
# before a human ever looks at it — the same test suite and build that
# deploy.yml runs on master, just moved earlier (to PR time) instead of
# discovering a broken data/*.json only after merge. generate.mjs already
# validates JSON structure, required fields (id/path), slug uniqueness,
# and computed sizes; this workflow just makes sure that validation runs
# as a required status check on every PR that could touch it.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build (validates every data/*.json)
        run: node scripts/generate.mjs
