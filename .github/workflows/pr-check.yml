name: PR Check

# Runs on every pull request so a contribution gets automated feedback
# before a human ever looks at it — the same test suite and build that
# deploy.yml runs on master, just moved earlier (to PR time). The build
# fetches domains and projects from awesomemap-data's API rather than
# local files; generate.mjs still validates the response shape (required
# fields, slug uniqueness, no dangling project references) and computed
# sizes, so this workflow makes sure that validation runs as a required
# status check on every PR.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build (validates the awesomemap-data API response)
        run: node scripts/generate.mjs
