name: Update README risers

# Keeps README.md's "Top risers this week" section (scripts/readme-risers.mjs)
# in sync with awesomemap-data's live star-history API. Runs shortly before
# deploy.yml's own daily cron so a README commit here also triggers that
# workflow's `on: push` build, keeping the site and the README's snapshot
# from drifting more than a few minutes apart.
on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      AWESOMEMAP_DATA_API_URL: ${{ secrets.AWESOMEMAP_DATA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/readme-risers.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "chore: update README top risers"
            git push
          fi
