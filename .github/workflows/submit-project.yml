name: Process project submission

# Fires the instant a "Suggest a project" issue is opened — whether via
# the /submit/ page's prefilled redirect or typed by hand — and
# auto-processes it end to end via awesomemap-data's
# scripts/process-submission.mjs: parse, quality bar, classify, commit to
# D1 or reject, always closing the issue with a comment. No maintainer
# step. See docs/superpowers/specs/2026-09-08-submission-trigger-design.md
# for why this checks out awesomemap-data's source and runs it here
# (passing --repo) rather than dispatching a workflow over there.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to (re)process"
        required: true

concurrency:
  group: submission-${{ github.event.inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process:
    # The "discovery" label is applied automatically by suggest-a-project.md
    # (see .github/ISSUE_TEMPLATE/) — scoping on it (rather than every
    # opened issue) keeps this from firing on a New domain proposal or a
    # plain bug report. Always runs for a manual workflow_dispatch, since
    # that's an explicit maintainer request to (re)process a specific issue.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'discovery')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AWESOMEMAP_DATA_API_URL: ${{ secrets.AWESOMEMAP_DATA_API_URL }}
      AWESOMEMAP_DATA_INTERNAL_TOKEN: ${{ secrets.AWESOMEMAP_DATA_INTERNAL_TOKEN }}
    steps:
      # awesomemap-data owns process-submission.mjs and the D1-backed
      # data-store.mjs it depends on — checked out read-only (Contents:
      # Read-only PAT) rather than ported here, so this stays a thin
      # trigger, not a second copy of the pipeline.
      - uses: actions/checkout@v4
        with:
          repository: haggaishachar/awesomemap-data
          token: ${{ secrets.AWESOMEMAP_DATA_CHECKOUT_TOKEN }}
          path: awesomemap-data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: awesomemap-data
        run: npm ci
      # --repo pins the target explicitly: GH_TOKEN above is this
      # workflow's own default token (scoped to awesomemap, issues:write),
      # but cwd is the awesomemap-data checkout, whose git remote would
      # otherwise make `gh` default to the wrong repo.
      - working-directory: awesomemap-data
        run: |
          node scripts/process-submission.mjs \
            --issue "${{ github.event.inputs.issue || github.event.issue.number }}" \
            --repo haggaishachar/awesomemap
